    url: https://github.com/NarysAI/PUB.git
    web: https://github.com/NarysAI/PUB/tree/main/std/metric/standoffs
    revision: main
    relPath: std/metric/standoffs
  nema:
    desc: Standard NEMA* interfaces
    type: git
    url: https://github.com/NarysAI/PUB.git
    web: https://github.com/NarysAI/PUB/tree/main/std/metric/nema
    revision: main
    relPath: std/metric/nema
